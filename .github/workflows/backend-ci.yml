
name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify .NET installation
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore src/backend/Carbon_Emissions_Management.slnx

      - name: Build solution
        run: dotnet build src/backend/Carbon_Emissions_Management.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/backend/Carbon_Emissions_Management.slnx --configuration Release --no-build --no-restore --verbosity normal
